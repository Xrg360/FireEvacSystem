[project]
name = "fire-backend"
version = "1.0.0"
description = "AI-Driven Smart Fire Evacuation System: Flask + Flask-SocketIO backend"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
